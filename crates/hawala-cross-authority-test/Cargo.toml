[package]
name = "hawala-cross-authority-test"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "TEST-ONLY durable host conformance; no financial authority or execution"

[features]
default = []
conformance = ["dep:rusqlite", "dep:serde_json", "dep:ed25519-dalek", "dep:sha2"]

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
serde_json = { version = "1", optional = true }

ed25519-dalek = { version = "2.1", optional = true }
sha2 = { version = "0.10", optional = true }

[[bin]]
name = "hawala-test-service"
path = "src/bin/service.rs"
required-features = ["conformance"]

[[test]]
name = "host"
required-features = ["conformance"]

[[test]]
name = "endpoints"
required-features = ["conformance"]
