[package]
name = "hawala-identity-sqlite"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Crash-durable, local replay-prevention storage for QR identity proofs"

[dependencies]
hawala-identity-core = { path = "../identity-core" }
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
ed25519-dalek = "2.1"
